name: API checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: connecta
          POSTGRES_PASSWORD: connecta_test
          POSTGRES_DB: connecta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connecta -d connecta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://connecta:connecta_test@localhost:5432/connecta_test
      TEST_DATABASE_URL: postgresql://connecta:connecta_test@localhost:5432/connecta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
